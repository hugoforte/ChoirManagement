name: Playwright E2E

on:
  # Deliberately NOT push on "**": a push to a PR branch would fire this
  # workflow twice for the same commit (once per event), and the two runs
  # race for the same Vercel deployment — whichever loses sits in the
  # resolve-deployment-url poll until it trips the 10-minute job timeout and
  # is cancelled. A cancelled run of a *required* check blocks the merge even
  # though its twin passed, which is exactly what happened on #15. PR
  # branches are covered by pull_request; main is covered by push.
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# One in-flight run per ref is enough; a newer commit supersedes an older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Adapted from https://github.com/hugoforte/hugo-tessa-20-years's
# preview-playwright.yml. Tests run against a REAL deployed Vercel URL, never
# a dev server spun up in CI — same philosophy as that repo's config, where
# PLAYWRIGHT_BASE_URL also drives local runs (defaults to localhost:5173).
#
# Both jobs now target the same place on a PR — that branch's own preview
# deployment, backed by its own auto-seeded Convex backend:
#   - e2e-guest: the unauthenticated project (public Events site, ticket #7).
#     Also runs on pushes to main, where it targets production instead.
#   - e2e-authenticated: chromium-director, signed in via @clerk/testing's
#     email-based ticket strategy against a "+clerk_test" account. PR-only,
#     because production deliberately holds no test Member rows.
#
# They stay two jobs rather than one so a failure says which half broke, and
# so the guest half still covers production post-merge.
#
# Both skip gracefully (not fail) if the required Vercel secrets aren't
# configured — matters for contributor forks and self-hosters who haven't
# wired up Vercel/E2E at all.

jobs:
  e2e-guest:
    if: ${{ github.event_name != 'pull_request' || (!github.event.pull_request.draft && !github.event.pull_request.head.repo.fork) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Check Vercel secrets
        id: secrets
        run: |
          if [[ -n "${{ secrets.VERCEL_TOKEN }}" && -n "${{ secrets.VERCEL_PROJECT_ID }}" && -n "${{ secrets.VERCEL_TEAM_ID }}" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Playwright E2E skipped::Missing VERCEL_TOKEN / VERCEL_PROJECT_ID / VERCEL_TEAM_ID."
          fi

      # Poll Vercel's deployments API for the READY deployment matching this
      # commit SHA, same approach as the reference repo. A direct push to
      # main never produces a "preview" deployment (Vercel deploys it as
      # production directly) - found this the hard way when this step
      # spun for the full 10-minute timeout waiting for a preview that
      # would never exist. Target production for main pushes, preview for
      # everything else (PRs, other branches).
      - name: Resolve deployment URL
        id: deployment
        if: steps.secrets.outputs.available == 'true'
        run: node scripts/ci/resolve-vercel-deployment-url.mjs --target=${{ (github.ref == 'refs/heads/main' && github.event_name == 'push') && 'production' || 'preview' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          # On pull_request, github.sha is a synthetic merge commit Vercel
          # never builds — use the PR head SHA so the poll can actually match.
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install Playwright browser
        if: steps.secrets.outputs.available == 'true'
        run: npx playwright install --with-deps chromium

      - name: Run guest E2E project against the resolved deployment
        if: steps.secrets.outputs.available == 'true'
        run: npx playwright test --project=chromium-guest
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.deployment.outputs.deployment_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

  # Runs on PRs, against the branch's OWN preview deployment — not against
  # production. Two reasons: authenticated coverage is far more useful before
  # a merge than after, and production deliberately holds no test Member rows
  # any more (the accounts have trivial passwords and production is publicly
  # reachable, so they exist only on throwaway preview backends).
  e2e-authenticated:
    if: ${{ github.event_name == 'pull_request' && !github.event.pull_request.draft && !github.event.pull_request.head.repo.fork }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Check Vercel secrets
        id: secrets
        run: |
          if [[ -n "${{ secrets.VERCEL_TOKEN }}" && -n "${{ secrets.VERCEL_PROJECT_ID }}" && -n "${{ secrets.VERCEL_TEAM_ID }}" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Playwright E2E skipped::Missing VERCEL_TOKEN / VERCEL_PROJECT_ID / VERCEL_TEAM_ID."
          fi

      - name: Resolve preview deployment URL
        id: deployment
        if: steps.secrets.outputs.available == 'true'
        run: node scripts/ci/resolve-vercel-deployment-url.mjs --target=preview
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          # On pull_request, github.sha is a synthetic merge commit Vercel
          # never builds — use the PR head SHA so the poll can actually match.
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install Playwright browser
        if: steps.secrets.outputs.available == 'true'
        run: npx playwright install --with-deps chromium

      # No seeding step: the preview deployment seeds itself. Convex runs
      # seed:preview via --preview-run when it provisions the branch's backend
      # (see vercel.json), which creates demo content plus one Member per Role.
      #
      # chromium-admin/chromium-chorister still don't exist (no admin- or
      # chorister-only UI to test against yet) — only chromium-director is
      # wired up so far. Their Clerk accounts and seeded Member rows already
      # exist, so adding them is just a Playwright project plus specs.
      - name: Run Director E2E project against the preview deployment
        if: steps.secrets.outputs.available == 'true'
        run: npx playwright test --project=chromium-director
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.deployment.outputs.deployment_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          # Publishable, not secret — client bundles ship it in every page
          # load already. @clerk/testing's clerkSetup() reads it from this
          # exact env var name as one of its fallbacks.
          VITE_CLERK_PUBLISHABLE_KEY: pk_test_bGVuaWVudC1vcmNhLTUwNzkuY2xlcmsuYWNjb3VudHMuZGV2JA
          E2E_DIRECTOR_EMAIL: ${{ secrets.E2E_DIRECTOR_EMAIL }}
