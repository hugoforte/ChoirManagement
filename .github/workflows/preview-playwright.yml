name: Playwright E2E

on:
  push:
    branches: ["**"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# PROTOTYPE — adapted from https://github.com/hugoforte/hugo-tessa-20-years's
# preview-playwright.yml. Tests run against a REAL deployed Vercel URL, never
# a dev server spun up in CI — same philosophy as that repo's config, where
# PLAYWRIGHT_BASE_URL also drives local runs (defaults to localhost:5173).
#
# Split into two jobs because Clerk does not support ephemeral vercel.app
# preview URLs (needs a custom domain) — see docs/architecture/ci-cd-and-testing.md:
#   - e2e-guest: every push/PR, against that commit's PREVIEW deployment.
#     Only the unauthenticated "guest" Playwright project runs here (the
#     public Events site, ticket #7) — no Clerk login involved.
#   - e2e-authenticated: push to main only, against PRODUCTION. Runs the
#     Director role project (chromium-director) — signed in via
#     @clerk/testing's email-based ticket sign-in against a dedicated
#     "+clerk_test" Clerk account, no UI form automation or real email.
#     Admin/Chorister projects don't exist yet (no role-gated UI to test).
#
# Both jobs skip gracefully (not fail) if the required Vercel secrets aren't
# configured — matters for contributor forks and self-hosters who haven't
# wired up Vercel/E2E at all.

jobs:
  e2e-guest:
    if: ${{ github.event_name != 'pull_request' || (!github.event.pull_request.draft && !github.event.pull_request.head.repo.fork) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Check Vercel secrets
        id: secrets
        run: |
          if [[ -n "${{ secrets.VERCEL_TOKEN }}" && -n "${{ secrets.VERCEL_PROJECT_ID }}" && -n "${{ secrets.VERCEL_TEAM_ID }}" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Playwright E2E skipped::Missing VERCEL_TOKEN / VERCEL_PROJECT_ID / VERCEL_TEAM_ID."
          fi

      # Poll Vercel's deployments API for the READY deployment matching this
      # commit SHA, same approach as the reference repo. A direct push to
      # main never produces a "preview" deployment (Vercel deploys it as
      # production directly) - found this the hard way when this step
      # spun for the full 10-minute timeout waiting for a preview that
      # would never exist. Target production for main pushes, preview for
      # everything else (PRs, other branches).
      - name: Resolve deployment URL
        id: deployment
        if: steps.secrets.outputs.available == 'true'
        run: node scripts/ci/resolve-vercel-deployment-url.mjs --target=${{ (github.ref == 'refs/heads/main' && github.event_name == 'push') && 'production' || 'preview' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}

      - name: Install Playwright browser
        if: steps.secrets.outputs.available == 'true'
        run: npx playwright install --with-deps chromium

      - name: Run guest E2E project against the resolved deployment
        if: steps.secrets.outputs.available == 'true'
        run: npx playwright test --project=chromium-guest
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.deployment.outputs.deployment_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

  e2e-authenticated:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Check Vercel secrets
        id: secrets
        run: |
          if [[ -n "${{ secrets.VERCEL_TOKEN }}" && -n "${{ secrets.VERCEL_PROJECT_ID }}" && -n "${{ secrets.VERCEL_TEAM_ID }}" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Playwright E2E skipped::Missing VERCEL_TOKEN / VERCEL_PROJECT_ID / VERCEL_TEAM_ID."
          fi

      - name: Resolve production deployment URL
        id: deployment
        if: steps.secrets.outputs.available == 'true'
        run: node scripts/ci/resolve-vercel-deployment-url.mjs --target=production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}

      - name: Install Playwright browser
        if: steps.secrets.outputs.available == 'true'
        run: npx playwright install --with-deps chromium

      # Seed data (upstream demo only — a self-hoster's prod deploy has real
      # data and should NOT run this). Guarded by repository so a self-hoster's
      # fork skips it even with Vercel secrets configured.
      #
      # Disabled for now (if: false): convex/seed.ts:demo doesn't exist yet.
      # Re-enable once it's written — don't just flip this back on blind.
      - name: Reseed demo data
        if: false && steps.secrets.outputs.available == 'true' && github.repository == 'hugoforte/ChoirManagement'
        run: npx convex run seed:demo
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

      # chromium-admin/chromium-chorister still don't exist (no admin- or
      # chorister-only UI to test against yet) — only chromium-director is
      # wired up so far, backed by a dedicated "+clerk_test" Clerk account
      # (e2e/auth.setup.ts). Add the other two roles' projects + secrets
      # here once there's role-gated UI worth testing for them.
      - name: Run Director E2E project against production
        if: steps.secrets.outputs.available == 'true'
        run: npx playwright test --project=chromium-director
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.deployment.outputs.deployment_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          # Publishable, not secret — client bundles ship it in every page
          # load already. @clerk/testing's clerkSetup() reads it from this
          # exact env var name as one of its fallbacks.
          VITE_CLERK_PUBLISHABLE_KEY: pk_test_bGVuaWVudC1vcmNhLTUwNzkuY2xlcmsuYWNjb3VudHMuZGV2JA
          E2E_DIRECTOR_EMAIL: ${{ secrets.E2E_DIRECTOR_EMAIL }}
