name: Playwright E2E

on:
  push:
    branches: ["**"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# PROTOTYPE — adapted from https://github.com/hugoforte/hugo-tessa-20-years's
# preview-playwright.yml. Tests run against a REAL deployed Vercel URL, never
# a dev server spun up in CI — same philosophy as that repo's config, where
# PLAYWRIGHT_BASE_URL also drives local runs (defaults to localhost:5173).
#
# Split into two jobs because Clerk does not support ephemeral vercel.app
# preview URLs (needs a custom domain) — see docs/architecture/ci-cd-and-testing.md:
#   - e2e-guest: every push/PR, against that commit's PREVIEW deployment.
#     Only the unauthenticated "guest" Playwright project runs here (the
#     public Events site, ticket #7) — no Clerk login involved.
#   - e2e-authenticated: push to main only, against PRODUCTION (a stable,
#     custom-domained URL where Clerk works). Runs the full Admin/Director/
#     Chorister role projects.
#
# Both jobs skip gracefully (not fail) if the required Vercel secrets aren't
# configured — matters for contributor forks and self-hosters who haven't
# wired up Vercel/E2E at all.

jobs:
  e2e-guest:
    if: ${{ github.event_name != 'pull_request' || (!github.event.pull_request.draft && !github.event.pull_request.head.repo.fork) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Check Vercel secrets
        id: secrets
        run: |
          if [[ -n "${{ secrets.VERCEL_TOKEN }}" && -n "${{ secrets.VERCEL_PROJECT_ID }}" && -n "${{ secrets.VERCEL_TEAM_ID }}" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Playwright E2E skipped::Missing VERCEL_TOKEN / VERCEL_PROJECT_ID / VERCEL_TEAM_ID."
          fi

      # Poll Vercel's deployments API for the READY preview matching this
      # commit SHA (target=preview), same approach as the reference repo.
      - name: Resolve preview deployment URL
        id: deployment
        if: steps.secrets.outputs.available == 'true'
        run: node scripts/ci/resolve-vercel-deployment-url.mjs --target=preview
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}

      - name: Install Playwright browser
        if: steps.secrets.outputs.available == 'true'
        run: npx playwright install --with-deps chromium

      - name: Run guest E2E project against the preview deployment
        if: steps.secrets.outputs.available == 'true'
        run: npx playwright test --project=chromium-guest
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.deployment.outputs.deployment_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

  e2e-authenticated:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Check Vercel secrets
        id: secrets
        run: |
          if [[ -n "${{ secrets.VERCEL_TOKEN }}" && -n "${{ secrets.VERCEL_PROJECT_ID }}" && -n "${{ secrets.VERCEL_TEAM_ID }}" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Playwright E2E skipped::Missing VERCEL_TOKEN / VERCEL_PROJECT_ID / VERCEL_TEAM_ID."
          fi

      - name: Resolve production deployment URL
        id: deployment
        if: steps.secrets.outputs.available == 'true'
        run: node scripts/ci/resolve-vercel-deployment-url.mjs --target=production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}

      - name: Install Playwright browser
        if: steps.secrets.outputs.available == 'true'
        run: npx playwright install --with-deps chromium

      # Seed data (upstream demo only — a self-hoster's prod deploy has real
      # data and should NOT run this). Guarded by repository so a self-hoster's
      # fork skips it even with Vercel secrets configured.
      #
      # Disabled for now (if: false): convex/seed.ts:demo doesn't exist yet.
      # Re-enable once it's written — don't just flip this back on blind.
      - name: Reseed demo data
        if: false && steps.secrets.outputs.available == 'true' && github.repository == 'hugoforte/ChoirManagement'
        run: npx convex run seed:demo
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

      # Disabled for now (if: false): chromium-admin/director/chorister
      # aren't defined in playwright.config.ts yet — no role-gated UI or
      # test Clerk accounts exist to back them. Only chromium-guest is real
      # (see e2e-guest above). Re-enable once those projects + fixtures
      # exist, per docs/architecture/ci-cd-and-testing.md.
      - name: Run Admin/Director/Chorister E2E projects against production
        if: false && steps.secrets.outputs.available == 'true'
        run: npx playwright test --project=chromium-admin --project=chromium-director --project=chromium-chorister
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.deployment.outputs.deployment_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
