name: CI checks

on:
  # No branches: filter on pull_request — main's branch protection requires
  # "check" as a status, and gh-stack correctly enforces that same
  # requirement on every layer of a stack, not just the one merging into
  # main directly. A PR targeting an intermediate stack branch still needs
  # this job to run and report, or the required check sits as "Expected"
  # forever and blocks the stack from merging (see #45). preview-playwright.yml's
  # pull_request trigger already has no branch filter for the same reason.
  pull_request:
  push:
    branches: [main]

# Validation only — see docs/architecture/ci-cd-and-testing.md. Actual deploy
# is NOT done here: Vercel's own git integration deploys the frontend +
# Convex functions together (Build Command: `npx convex deploy --cmd 'npm run
# build'`, per docs.convex.dev/production/hosting/vercel).

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check   # tsc -p convex && tsc -p tsconfig.app.json && tsc -p tsconfig.node.json && vite build
      - run: npm test        # vitest (unit + convex-test)
