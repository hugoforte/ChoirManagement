name: Deploy public demo

on:
  push:
    branches: [main]

# PROTOTYPE — maintainer-only, runs against the upstream hugoforte/ChoirManagement
# repo (not a self-hoster's fork). Deploys the public try-before-you-self-host
# demo: a dedicated Convex project seeded with fake data, frontend published to
# GitHub Pages (zero extra account, pairs naturally with GH Actions).

jobs:
  deploy-demo:
    if: github.repository == 'hugoforte/ChoirManagement'
    runs-on: ubuntu-latest
    environment: demo
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test

      - name: Deploy Convex functions to the demo project
        run: npx convex deploy --prod
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.DEMO_CONVEX_DEPLOY_KEY }}

      - name: Seed demo data
        run: npx convex run seed:demo
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.DEMO_CONVEX_DEPLOY_KEY }}
        # seed:demo is a Convex function, TBD — resets/repopulates fake
        # Choir/Members/Pieces/Events so the public demo stays presentable.

      - name: Build frontend (demo mode)
        run: npm run build
        env:
          VITE_CONVEX_URL: ${{ secrets.DEMO_CONVEX_URL }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.DEMO_CLERK_PUBLISHABLE_KEY }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/
      - uses: actions/deploy-pages@v4
